# Reverse proxy façon ultra.cc : FanKarr dans un sous-dossier de l'hôte
server {
    listen 80;

    location /fankarr {
        proxy_pass         http://fankarr:9898;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Tout le reste n'appartient pas à FanKarr : vérifie qu'aucune URL ne part à la racine
    location / {
        return 404 "Hors de /fankarr : URL non préfixée\n";
    }
}
