# Banc de test local : http://localhost:8095/fankarr
# Prérequis : pnpm package:linux (remplit release/fankarr-linux-x64)
# Lancer : docker compose -f deploy/ultracc-test/docker-compose.yml up -d --build
name: fankarr-ultracc-test

services:
  fankarr:
    build: .
    volumes:
      - ../../release/fankarr-linux-x64:/pkg:ro
      - config:/config
    environment:
      TEST_BASE_PATH: /fankarr
      TEST_PORT: "9898"
    restart: unless-stopped

  proxy:
    image: nginx:stable
    ports:
      - "8095:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fankarr
    restart: unless-stopped

volumes:
  config:
